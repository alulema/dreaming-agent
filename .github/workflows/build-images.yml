name: Build & push images (GHCR)

# Builds and publishes the demo's two images (app, ollama with baked models) to GHCR.
# After the first push, mark both packages as Public (package Settings) so they can be pulled
# without credentials.

on:
  push:
    branches: [main]
    paths: ["app/**", "requirements.txt", "Dockerfile", "Dockerfile.ollama",
            ".github/workflows/build-images.yml"]
  workflow_dispatch:

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check app tests bench scripts
      - run: uv run pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: app
            dockerfile: Dockerfile
          - service: ollama
            dockerfile: Dockerfile.ollama
    steps:
      - uses: actions/checkout@v5

      # The Ollama image carries ~3 GB of model weights: free space on the runner.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL || true
          df -h

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/dreaming-agent-${{ matrix.service }}:latest
            ghcr.io/${{ github.repository_owner }}/dreaming-agent-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
